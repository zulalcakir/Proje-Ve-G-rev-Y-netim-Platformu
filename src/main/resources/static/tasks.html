<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görevlerim | P-PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .kanban-column {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            min-height: 70vh;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .task-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .task-card:hover { background: rgba(255, 255, 255, 0.1); border-color: #00d2ff; }
        .column-title { font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .cyber-menu-item { border-radius: 12px; padding: 12px 20px !important; margin-bottom: 5px; color: rgba(255,255,255,0.7) !important; transition: 0.3s; display: flex; align-items: center; }
        .cyber-menu-item:hover, .cyber-menu-item.active { background: rgba(255, 255, 255, 0.1); color: #fff !important; }
    </style>
</head>
<body>
    <div class="color-blob blob-1"></div><div class="color-blob blob-2"></div>

    <div class="container-fluid p-4 dashboard-layout" style="height: 100vh;">
        <div class="row h-100 g-4">
            <div class="col-lg-3 h-100">
                <div class="glass-card h-100 d-flex flex-column p-4">
                    <div class="brand-area mb-5">
                        <h3 class="cool-title" style="font-size: 1.8rem;">P-PLATFORM</h3>
                    </div>
                    <nav class="flex-grow-1">
                        <ul class="nav flex-column gap-2">
                            <li class="nav-item"><a class="nav-link cyber-menu-item" href="dashboard.html"><i class="fas fa-home me-2"></i> Ana Panel</a></li>
                            <li class="nav-item"><a class="nav-link cyber-menu-item" href="projects.html"><i class="fas fa-project-diagram me-2"></i> Projelerim</a></li>
                            <li class="nav-item"><a class="nav-link cyber-menu-item active" href="tasks.html"><i class="fas fa-check-double me-2"></i> Görevlerim</a></li>
                        </ul>
                    </nav>
                    <div class="profile-section mt-auto pt-4 border-top border-white border-opacity-10">
                        <div class="d-flex align-items-center mb-3">
                            <div id="user-avatar" class="avatar-circle me-3 d-flex align-items-center justify-content-center text-white fw-bold" style="width: 45px; height: 45px; background: linear-gradient(45deg, #ff007f, #7928ca); border-radius: 50%;">?</div>
                            <div>
                                <p id="user-full-name" class="m-0 fw-bold text-white small">Yükleniyor...</p>
                                <p id="user-role-label" class="m-0 text-white-50" style="font-size: 0.7rem;">Üye</p>
                            </div>
                        </div>
                        <button class="cyber-btn w-100 p-2 small" onclick="logout()"><span>ÇIKIŞ YAP</span></button>
                    </div>
                </div>
            </div>

            <div class="col-lg-9 h-100">
                <div class="glass-card h-100 p-4" style="overflow-y: auto;">
                    <h2 class="text-white fw-900 mb-5">Görev <span style="color: #ff007f;">Akışım</span></h2>
                    
                    <div class="row g-4">
                        <div class="col-md-4">
                            <div class="column-title text-warning"><span class="dot bg-warning"></span> Beklemede</div>
                            <div class="kanban-column" id="col-BEKLEMEDE"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="column-title text-info"><span class="dot bg-info"></span> Devam Ediyor</div>
                            <div class="kanban-column" id="col-DEVAM_EDIYOR"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="column-title text-success"><span class="dot bg-success"></span> Tamamlandı</div>
                            <div class="kanban-column" id="col-TAMAMLANDI"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="tasks.js"></script>
</body>
</html>
