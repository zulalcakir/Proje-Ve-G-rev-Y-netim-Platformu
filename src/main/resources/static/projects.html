<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projelerim | P-PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .cyber-menu-item { border-radius: 12px; padding: 12px 20px !important; margin-bottom: 5px; color: rgba(255,255,255,0.7) !important; transition: 0.3s; display: flex; align-items: center; }
        .cyber-menu-item:hover, .cyber-menu-item.active { background: rgba(255, 255, 255, 0.1); color: #fff !important; }
        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            height: 100%;
        }
        .project-card:hover { transform: translateY(-5px); border-color: #00d2ff; background: rgba(255, 255, 255, 0.05); }
        .progress-bar-custom { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(45deg, #00d2ff, #3a7bd5); transition: width 0.5s ease; }
        .main-content-scroll::-webkit-scrollbar { display: none; }
        .main-content-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="container-fluid p-4 dashboard-layout" style="height: 100vh;">
        <div class="row h-100 g-4">
            
            <div class="col-lg-3 h-100">
                <div class="glass-card h-100 d-flex flex-column p-4 shadow-lg">
                    <div class="brand-area mb-5">
                        <h3 class="cool-title" style="font-size: 1.8rem;">P-PLATFORM</h3>
                        <p class="subtitle" style="font-size: 0.75rem; letter-spacing: 2px;">MANAGEMENT SUITE</p>
                    </div>
                    
                    <nav class="flex-grow-1">
                        <ul class="nav flex-column gap-2">
                            <li class="nav-item"><a class="nav-link cyber-menu-item" href="dashboard.html"><i class="fas fa-home me-2"></i> Ana Panel</a></li>
                            <li class="nav-item"><a class="nav-link cyber-menu-item active" href="projects.html"><i class="fas fa-project-diagram me-2"></i> Projelerim</a></li>
                            <li class="nav-item"><a class="nav-link cyber-menu-item" href="#"><i class="fas fa-check-double me-2"></i> Görevlerim</a></li>
                        </ul>
                    </nav>

                    <div class="profile-section mt-auto pt-4 border-top border-white border-opacity-10">
                        <div class="d-flex align-items-center mb-3">
                            <div id="user-avatar" class="avatar-circle me-3 d-flex align-items-center justify-content-center text-white fw-bold shadow-sm" style="width: 48px; height: 48px; background: linear-gradient(45deg, #ff007f, #7928ca); border-radius: 50%; font-size: 1.3rem;">?</div>
                            <div>
                                <p id="user-full-name" class="m-0 fw-bold text-white" style="font-size: 0.95rem;">Yükleniyor...</p>
                                <p id="user-role-label" class="m-0 text-white-50" style="font-size: 0.75rem;">Üye</p>
                            </div>
                        </div>
                        <button class="cyber-btn w-100" style="padding: 12px; font-size: 0.85rem;" onclick="logout()">
                            <span><i class="fas fa-sign-out-alt me-2"></i> GÜVENLİ ÇIKIŞ</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-9 h-100">
                <div class="glass-card h-100 p-4 main-content-scroll" style="overflow-y: auto;">
                    
                    <div class="header-section mb-5 d-flex justify-content-between align-items-end">
                        <div>
                            <h2 class="text-white fw-900" style="font-size: 2.2rem;">Dahil Olduğum <span style="color: #00d2ff;">Projeler</span></h2>
                            <p class="subtitle opacity-75">Yönettiğiniz veya görev aldığınız tüm projeler.</p>
                        </div>
                    </div>
                    
                    <div class="row g-4" id="projects-container">
                        <div class="col-12 text-center mt-5">
                            <p class="text-muted">Projeler yükleniyor...</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="projects.js"></script>
</body>
</html>
