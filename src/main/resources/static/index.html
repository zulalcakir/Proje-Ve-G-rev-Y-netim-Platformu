<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje & Görev | Hoş Geldin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="login-container">
        <div class="glass-card">
            <div class="card-header text-center mb-4">
                <h1 class="cool-title">MERHABA</h1>
                <p class="subtitle">Platforma giriş yap ve projelerini tamamla.🚀</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group-custom mb-4">
                    <input type="text" class="cool-input" id="username" placeholder="Kullanıcı Adı (@username)" required>
                </div>
                <div class="input-group-custom mb-5">
                    <input type="password" class="cool-input" id="password" placeholder="Şifren (Sır gibi saklı)" required>
                </div>
                <button type="submit" class="cyber-btn">
                    <span>SİSTEME GİRİŞ YAP</span>
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
