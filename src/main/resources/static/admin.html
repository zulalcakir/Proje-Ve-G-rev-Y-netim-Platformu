<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sistem Yönetimi | P-PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin için özel kırmızımtırak neon teması */
        .blob-1 { background: #ff4b2b; }
        .blob-2 { background: #ff416c; }
        .stat-card { background: rgba(255, 65, 108, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Log Kutusu Tasarımı */
        .log-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: 200px;
            overflow-y: auto;
            border-radius: 12px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.85rem;
            scrollbar-width: none;
        }
        .log-box::-webkit-scrollbar { display: none; }

        /* --- MODAL (PENCERE) TASARIMI --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            margin: 5% auto;
            padding: 0;
            border: none;
            width: 90%;
            max-width: 450px;
            animation: slideDown 0.4s ease-out;
        }

        .close-btn {
            position: absolute;
            right: 25px; top: 15px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            z-index: 10;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>

    <div class="container-fluid p-4">
        <div class="glass-card" style="max-width: 1200px; margin: auto;">
            
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="cool-title" style="font-size: 2.5rem;">SİSTEM YÖNETİMİ</h1>
                <button class="btn btn-outline-danger" onclick="window.location.href='index.html'">GÜVENLİ ÇIKIŞ</button>
            </div>

            <div class="row mb-5 text-center">
                <div class="col-md-4">
                    <div class="stat-card p-3 rounded">
                        <p class="subtitle">Kayıtlı Kullanıcı</p>
                        <h2 id="userCount" class="text-white fw-bold">...</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card p-3 rounded">
                        <p class="subtitle">Aktif Projeler</p>
                        <h2 id="projectCount" class="text-white fw-bold">...</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card p-3 rounded">
                        <p class="subtitle">Sistem Durumu</p>
                        <h2 class="text-success fw-bold">AKTİF</h2>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-white m-0">Tüm Kullanıcıların Listesi</h4>
                <button class="btn btn-success btn-sm fw-bold px-3" onclick="openUserModal()">+ Yeni Kullanıcı Ekle</button>
            </div>
            
            <div class="table-responsive mb-5">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kullanıcı Adı</th>
                            <th>E-posta</th>
                            <th>Roller</th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="adminUserTable">
                        </tbody>
                </table>
            </div>

            <h4 class="text-white mb-3">Sistem İşlem Logları</h4>
            <div class="log-box" id="systemLogs">
                <div class="text-success">[SİSTEM]: Veriler yükleniyor...</div>
            </div>

        </div>
    </div>

    <div id="userModal" class="modal">
        <div class="glass-card modal-content" style="padding: 40px;">
            <span class="close-btn" onclick="closeUserModal()">&times;</span>
            <h2 class="cool-title" style="font-size: 2rem; margin-bottom: 10px;">Yeni Kullanıcı</h2>
            <p class="subtitle" style="margin-bottom: 30px;">Sisteme yeni bir üye tanımlayın.</p>
            
            <form id="adminAddUserForm">
                <div class="mb-3">
                    <input type="text" id="admin-reg-name" class="cool-input" placeholder="Ad Soyad" required>
                </div>
                <div class="mb-3">
                    <input type="email" id="admin-reg-email" class="cool-input" placeholder="E-posta" required>
                </div>
                <div class="mb-3">
                    <input type="text" id="admin-reg-username" class="cool-input" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="mb-4">
                    <input type="password" id="admin-reg-password" class="cool-input" placeholder="Şifre" required>
                </div>
                
                <button type="submit" class="cyber-btn">KULLANICIYI KAYDET</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
