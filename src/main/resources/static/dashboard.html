<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Panel | Proje Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="container-fluid p-4 dashboard-layout">
        <div class="row h-100">
            
            <div class="col-md-3 h-100">
                <div class="glass-card h-100 d-flex flex-column p-4">
                    <h3 class="cool-title" style="font-size: 1.8rem;">P-PLATFORM</h3>
                    <p class="subtitle mb-5">Ana Menü</p>
                    
                    <ul class="nav flex-column gap-3">
                        <li class="nav-item">
                            <a class="nav-link cyber-menu-item active" href="dashboard.html">🏠 Ana Panel</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link cyber-menu-item" href="#">📁 Projelerim</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link cyber-menu-item" href="#">✅ Görevler</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link cyber-menu-item" href="admin.html">🔔 Bildirimler</a>
                        </li>
                    </ul>

                    <button class="cyber-btn mt-auto" style="padding: 10px; font-size: 0.9rem;" onclick="window.location.href='index.html'">
                        <span>ÇIKIŞ YAP</span>
                    </button>
                </div>
            </div>

            <div class="col-md-9 h-100">
                <div class="glass-card h-100 p-4" style="overflow-y: auto;">
                    <h2 class="text-white mb-4 fw-bold">Hoş Geldin! 👋</h2>
                    
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="stat-box p-3 rounded text-center">
                                <p class="mb-1 subtitle">Aktif Projeler</p>
                                <h3 id="proje-sayisi" class="cool-title" style="font-size: 2.5rem;">...</h3>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-box p-3 rounded text-center">
                                <p class="mb-1 subtitle">Bekleyen Görevler</p>
                                <h3 id="gorev-sayisi" class="cool-title" style="font-size: 2.5rem;">...</h3>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-box p-3 rounded text-center">
                                <p class="mb-1 subtitle">Tamamlanan</p>
                                <h3 id="tamamlanan-sayisi" class="cool-title" style="font-size: 2.5rem;">0</h3>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-5">
                        <div class="col-md-7">
                            <h4 class="text-white mb-3 fw-bold">Yaklaşan Görevler</h4>
                            <div id="task-list-container" class="task-list">
                                <p class="text-muted">Görevler yükleniyor...</p>
                            </div>
                        </div>

                        <div class="col-md-5">
                            <h4 class="text-white mb-3 fw-bold">Sistem Hareketleri</h4>
                            <div id="recent-logs" class="stat-box p-3 rounded" style="min-height: 300px; background: rgba(255,255,255,0.05);">
                                <p class="text-muted" style="font-size: 0.8rem;">Son işlemler taranıyor...</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
