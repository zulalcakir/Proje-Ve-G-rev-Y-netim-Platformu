
# 1. UYGULAMA BİLGİSİ
spring.application.name=proje-ve-gorev-yonetimi

# 2. H2 VERİTABANI AYARLARI (Kurulum Gerektirmez)
spring.datasource.url=jdbc:h2:mem:pgyp_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. TABLO OLUŞTURMA (Java sınıflarından otomatik tablo yapar)
spring.jpa.hibernate.ddl-auto=update

# 4. H2 KONSOLU (Veritabanını tarayıcıdan görmek için)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 5. GÜVENLİK VE LOGLAMA (Hocaya göstermek için SQL'leri yazdırır)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=INFO

# 6. SQL DOSYALARINI ÇALIŞTIRMA (schema.sql yazarsan aktif olur)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always