# ==========================================
# 1. UYGULAMA BİLGİSİ
# ==========================================
spring.application.name=proje-ve-gorev-yonetimi
server.port=8080

# ==========================================
# 2. H2 VERİTABANI AYARLARI
# ==========================================
spring.datasource.url=jdbc:h2:mem:pgyp_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# 3. TABLO VE JPA AYARLARI
# ==========================================
# Java sınıflarından tabloları otomatik oluşturur/günceller
spring.jpa.hibernate.ddl-auto=update
# Veritabanı bağlantısı kapandığında verilerin hemen silinmemesi için
spring.datasource.generate-unique-name=false
# Hibernate'in View içinde sorgu yapmasını engeller (Performans ve log temizliği için)
spring.jpa.open-in-view=false

# ==========================================
# 4. H2 KONSOLU AYARLARI
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Tarayıcı dışı bağlantılara izin ver
spring.h2.console.settings.web-allow-others=true
# HATA ayıklama için detaylı trace açar
spring.h2.console.settings.trace=true

# ==========================================
# 5. LOGLAMA VE SQL İZLEME (Ödev Sunumu İçin Önemli)
# ==========================================
# Çalışan SQL sorgularını terminalde gösterir
spring.jpa.show-sql=true
# SQL sorgularını okunabilir (formatlı) hale getirir
spring.jpa.properties.hibernate.format_sql=true
# Sorgularda parametrelerin değerlerini de gösterir
logging.level.org.hibernate.orm.jdbc.bind=trace

# ==========================================
# 6. GELISTIRICI AYARLARI
# ==========================================
# HTML (Thymeleaf) sayfalarında yaptığın değişikliğin anında yansıması için
spring.thymeleaf.cache=false
# Başlangıçta SQL dosyası (data.sql gibi) varsa çalıştırır
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always