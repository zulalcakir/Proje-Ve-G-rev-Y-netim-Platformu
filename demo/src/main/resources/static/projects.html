<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projelerim | P-PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Sadece projelere özel kart tasarımı */
        .project-card {
            background: rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
            height: 100%;
        }
        .project-card:hover { transform: translateY(-5px); border-color: #00d2ff; background: rgba(255, 255, 255, 0.05) !important; box-shadow: 0 10px 30px rgba(0,210,255,0.1); }
        .progress-bar-custom { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(45deg, #00d2ff, #7928ca); transition: width 0.5s ease; }
    </style>
</head>
<body>
    
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="app-container">
        
        <nav class="app-sidebar">
            <div class="mb-5 text-white" style="text-shadow: 0 0 10px rgba(255,255,255,0.3);"><i class="fas fa-layer-group fa-2x"></i></div>
            
            <a href="dashboard.html" class="menu-icon" title="Ana Panel"><i class="fas fa-home"></i></a>
            <a href="projects.html" class="menu-icon active" title="Projelerim"><i class="fas fa-project-diagram"></i></a>
            <a href="tasks.html" class="menu-icon" title="Görevlerim"><i class="fas fa-tasks"></i></a>
            
            <a href="#" class="menu-icon position-relative" onclick="openNotificationModal()" title="Bildirimler">
                <i class="fas fa-bell"></i>
                <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none" style="width:10px; height:10px;"></span>
            </a>
            
            <a href="#" class="menu-icon mt-auto text-danger" onclick="logout()" title="Çıkış Yap"><i class="fas fa-sign-out-alt"></i></a>
        </nav>

        <main class="app-main">
            <header class="page-header mb-5 d-flex justify-content-between align-items-center border-bottom border-white border-opacity-10 pb-4">
                <div>
                    <span class="text-muted small">Panel > Projelerim</span>
                    <h1 class="cool-title">Dahil Olduğum Projeler</h1>
                    <p class="subtitle opacity-75 m-0">Yönettiğiniz veya görev aldığınız tüm projeler.</p>
                </div>
                <div class="d-flex align-items-center gap-3 bg-dark bg-opacity-25 p-2 rounded-pill border border-white border-opacity-10 pe-4">
                    <div class="profile-avatar" id="user-avatar" style="width: 45px; height: 45px; font-size: 1.1rem; margin: 0;">?</div>
                    <div class="text-end">
                        <h6 id="user-full-name" class="m-0 text-white fw-bold" style="font-size: 0.9rem;">Yükleniyor...</h6>
                        <small id="user-role-label" class="text-info fw-bold" style="font-size: 0.7rem;">Üye</small>
                    </div>
                </div>
            </header>
            
            <div class="row g-4" id="projects-container">
                <div class="col-12 text-center mt-5">
                    <i class="fas fa-spinner fa-spin fa-2x text-muted mb-3"></i>
                    <p class="text-muted">Projeler yükleniyor...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeNotificationModal()">&times;</span>
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-white border-opacity-10 pb-3">
                <h3 class="cool-title m-0" style="font-size: 1.5rem;"><i class="fas fa-bell text-warning me-2"></i> Bildirimler</h3>
            </div>
            <div id="notification-list" style="max-height: 350px; overflow-y: auto; padding-right: 5px;">
                <p class="text-muted text-center mt-4 small">Yeni bildiriminiz yok.</p>
            </div>
        </div>
    </div>

    <script src="projects.js"></script>
    <script>
        function openNotificationModal() { document.getElementById('notificationModal').style.display = 'block'; }
        function closeNotificationModal() { document.getElementById('notificationModal').style.display = 'none'; }
        window.addEventListener('click', (e) => { if (e.target == document.getElementById('notificationModal')) closeNotificationModal(); });
    </script>
</body>
</html>
