<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Ayarları | P-PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="app-container">
        
        <nav class="app-sidebar">
            <div class="brand-area mb-5 d-flex flex-column align-items-center text-center mt-2">
                <svg width="45" height="45" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 5px 10px rgba(0, 210, 255, 0.5)); cursor: pointer;" onclick="location.href='dashboard.html'">
                    <defs>
                        <linearGradient id="pLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00d2ff" />
                            <stop offset="100%" stop-color="#7928ca" />
                        </linearGradient>
                    </defs>
                    <rect width="40" height="40" rx="12" fill="url(#pLogoGrad)" />
                    <path d="M 14 12 L 24 12 C 28 12 28 20 24 20 L 17 20 L 17 28" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <a href="dashboard.html" class="menu-icon" title="Dashboard"><i class="fas fa-home"></i></a>
            <a href="projects.html" class="menu-icon" title="Projeler"><i class="fas fa-project-diagram"></i></a>
            <a href="tasks.html" class="menu-icon" title="Görevler"><i class="fas fa-tasks"></i></a>
            <a href="profile.html" class="menu-icon active" title="Profilim"><i class="fas fa-user-cog"></i></a>
            
            <a href="#" class="menu-icon mt-auto text-danger" onclick="logout()" title="Çıkış Yap"><i class="fas fa-sign-out-alt"></i></a>
        </nav>

        <main class="app-main">
            <header class="page-header mb-5">
                <div>
                    <span class="text-muted small">Panel > Ayarlar</span>
                    <h1 class="cool-title">Profil <span class="text-pink">Ayarları</span></h1>
                    <p class="subtitle opacity-75">Kişisel bilgilerinizi buradan güncelleyebilirsiniz.</p>
                </div>
            </header>

            <div class="content-card mx-auto" style="max-width: 600px;">
                <h6 class="section-title mt-0">Kişisel Bilgiler</h6>
                
                <form id="profileForm">
                    <div class="mb-5 text-center">
                        <div class="profile-avatar mx-auto mb-3 shadow-lg" id="profile-display-avatar" style="width: 100px; height: 100px; font-size: 2.5rem; border: 3px solid rgba(255,255,255,0.1);">
                            ?
                        </div>
                        <h4 id="display-full-name" class="text-white m-0">...</h4>
                        <p class="text-white-50 small" id="display-username">@username</p>
                    </div>

                    <div class="mb-3">
                        <label class="text-white-50 small mb-2 ms-1">Tam Adınız Soyadınız</label>
                        <input type="text" id="profile-full-name" class="cool-input" placeholder="Ad Soyad" required>
                    </div>

                    <div class="mb-4">
                        <label class="text-white-50 small mb-2 ms-1">E-posta Adresi (Sadece Okunur)</label>
                        <input type="email" id="profile-email" class="cool-input" readonly style="opacity: 0.5; cursor: not-allowed;">
                    </div>

                    <button type="submit" class="cyber-btn w-100 mt-2">
                        DEĞİŞİKLİKLERİ KAYDET
                    </button>
                </form>

                <div id="update-status" class="mt-4 text-center small" style="display: none; padding: 10px; border-radius: 12px;"></div>
            </div>
        </main>

        <aside class="app-right-panel text-center">
            <h6 class="section-title">HESAP DURUMU</h6>
            <div class="content-card">
                <div class="text-success mb-2"><i class="fas fa-check-circle fa-2x"></i></div>
                <p class="m-0 text-white fw-bold">Aktif Hesap</p>
                <p class="text-muted small">P-PLATFORM Üyesi</p>
            </div>
            
            <h6 class="section-title mt-5">GÜVENLİK</h6>
            <p class="text-muted small">Şifrenizi değiştirmek için lütfen sistem yöneticisi ile iletişime geçin.</p>
        </aside>

    </div>

    <script src="profile.js"></script>
</body>
</html>
