<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görevlerim | P-PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .kanban-column { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); min-height: 60vh; }
        .task-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .task-card:hover { background: rgba(255, 255, 255, 0.1); border-color: #00d2ff; transform: translateY(-3px); }
    </style>
</head>
<body>
    
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="app-container">
        <nav class="app-sidebar">
            <div class="mb-5 text-white" style="text-shadow: 0 0 10px rgba(255,255,255,0.3);"><i class="fas fa-layer-group fa-2x"></i></div>
            
            <a href="dashboard.html" class="menu-icon" title="Ana Panel"><i class="fas fa-home"></i></a>
            <a href="projects.html" class="menu-icon" title="Projelerim"><i class="fas fa-project-diagram"></i></a>
            <a href="tasks.html" class="menu-icon active" title="Görevlerim"><i class="fas fa-tasks"></i></a>
            
            <a href="#" class="menu-icon position-relative" onclick="openNotificationModal()" title="Bildirimler">
                <i class="fas fa-bell"></i>
                <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none" style="width:10px; height:10px;"></span>
            </a>
            
            <a href="#" class="menu-icon mt-auto text-danger" onclick="logout()" title="Çıkış Yap"><i class="fas fa-sign-out-alt"></i></a>
        </nav>

        <main class="app-main d-flex flex-column">
            <header class="page-header mb-4 d-flex justify-content-between align-items-center border-bottom border-white border-opacity-10 pb-4">
                <div>
                    <span class="text-muted small">Panel > Görevlerim</span>
                    <h1 class="cool-title">Görev <span class="text-pink">Akışım</span></h1>
                </div>
                <div class="d-flex align-items-center gap-3 bg-dark bg-opacity-25 p-2 rounded-pill border border-white border-opacity-10 pe-4">
                    <div class="profile-avatar" id="user-avatar" style="width: 45px; height: 45px; font-size: 1.1rem; margin: 0; background: linear-gradient(45deg, #00d2ff, #7928ca); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">?</div>
                    <div class="text-end">
                        <h6 id="user-full-name" class="m-0 text-white fw-bold" style="font-size: 0.9rem;">Yükleniyor...</h6>
                        <small id="user-role-label" class="text-pink fw-bold" style="font-size: 0.7rem;">Çalışma Alanı</small>
                    </div>
                </div>
            </header>

            <div class="d-flex gap-4 flex-grow-1" style="overflow-x: auto; padding-bottom: 20px;">
                <div class="flex-grow-1 d-flex flex-column" style="min-width: 300px;">
                    <div class="text-warning mb-3 fw-bold small text-uppercase d-flex align-items-center tracking-wide"><span class="bg-warning d-inline-block rounded-circle me-2" style="width:10px; height:10px; box-shadow: 0 0 10px #ffc107;"></span> BEKLEMEDE</div>
                    <div class="kanban-column flex-grow-1" id="col-BEKLEMEDE"></div>
                </div>
                <div class="flex-grow-1 d-flex flex-column" style="min-width: 300px;">
                    <div class="text-info mb-3 fw-bold small text-uppercase d-flex align-items-center tracking-wide"><span class="bg-info d-inline-block rounded-circle me-2" style="width:10px; height:10px; box-shadow: 0 0 10px #00d2ff;"></span> DEVAM EDİYOR</div>
                    <div class="kanban-column flex-grow-1" id="col-DEVAM_EDIYOR"></div>
                </div>
                <div class="flex-grow-1 d-flex flex-column" style="min-width: 300px;">
                    <div class="text-success mb-3 fw-bold small text-uppercase d-flex align-items-center tracking-wide"><span class="bg-success d-inline-block rounded-circle me-2" style="width:10px; height:10px; box-shadow: 0 0 10px #00f2c3;"></span> TAMAMLANDI</div>
                    <div class="kanban-column flex-grow-1" id="col-TAMAMLANDI"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="taskDetailModal" class="modal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <span class="close-btn" onclick="closeTaskDetailModal()">&times;</span>
            <div class="mb-4">
                <span id="modal-task-project" class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 mb-2 px-3 py-2 rounded-pill">Proje Adı</span>
                <h3 id="modal-task-title" class="cool-title mb-2 text-white" style="font-size: 1.8rem;">Görev Başlığı</h3>
                <p id="modal-task-desc" class="text-white-50 small" style="line-height: 1.6;">Açıklama yükleniyor...</p>
            </div>
            
            <h6 class="section-title text-info mt-0">Proje Dosyaları</h6>
            <div class="input-group mb-3 shadow-sm">
                <input type="file" id="task-file-input" class="form-control cool-input m-0" style="border-radius: 12px 0 0 12px; background: rgba(255,255,255,0.05); color:white; border: 1px solid rgba(255,255,255,0.1);">
                <button class="cyber-btn m-0" onclick="dosyaYukle()" style="width: auto; border-radius: 0 12px 12px 0;"><i class="fas fa-cloud-upload-alt"></i> YÜKLE</button>
            </div>
            <div id="attachments-container" class="mb-4 d-flex flex-wrap gap-2" style="max-height: 120px; overflow-y: auto;"></div>
            
            <h6 class="section-title text-info" style="border-left-color: #00d2ff;">Yorumlar ve Notlar</h6>
            <div id="comments-container" class="mb-4 pe-2" style="max-height: 250px; overflow-y: auto;"></div>
            <form id="addCommentForm" class="mt-auto">
                <input type="hidden" id="comment-task-id">
                <div class="input-group shadow-sm">
                    <input type="text" id="new-comment-text" class="form-control cool-input m-0" placeholder="Not bırakın..." required style="border-radius: 12px 0 0 12px; background: rgba(255,255,255,0.05); color:white; border: 1px solid rgba(255,255,255,0.1);">
                    <button type="submit" class="cyber-btn m-0" style="width: auto; border-radius: 0 12px 12px 0; background: linear-gradient(45deg, #00d2ff, #7928ca);"><i class="fas fa-paper-plane"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeNotificationModal()">&times;</span>
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-white border-opacity-10 pb-3">
                <h3 class="cool-title m-0" style="font-size: 1.5rem;"><i class="fas fa-bell text-warning me-2"></i> Bildirimler</h3>
            </div>
            <div id="notification-list" style="max-height: 350px; overflow-y: auto; padding-right: 5px;"></div>
            <button class="cyber-btn mt-4" onclick="markAllNotificationsAsRead()">TÜMÜNÜ OKUNDU İŞARETLE</button>
        </div>
    </div>

    <script src="tasks.js"></script>
    <script>
        function openNotificationModal() { document.getElementById('notificationModal').style.display = 'block'; }
        function closeNotificationModal() { document.getElementById('notificationModal').style.display = 'none'; }
        window.addEventListener('click', (e) => { 
            if (e.target == document.getElementById('notificationModal')) closeNotificationModal(); 
            if (e.target == document.getElementById('taskDetailModal')) closeTaskDetailModal();
        });
    </script>
</body>
</html>
